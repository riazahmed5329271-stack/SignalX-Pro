name: Signal X Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.6.0 cython==0.29.36

      - name: Set Buildozer home
        run: |
          echo "BUILDOZER_HOME=$GITHUB_WORKSPACE/.buildozer" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$BUILDOZER_HOME/android/platform/android-sdk/licenses"

          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$BUILDOZER_HOME/android/platform/android-sdk/licenses/android-sdk-license"

          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$BUILDOZER_HOME/android/platform/android-sdk/licenses/android-sdk-license"

          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            >> "$BUILDOZER_HOME/android/platform/android-sdk/licenses/android-sdk-license"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalXPro-APK
          path: bin/*.apk
